<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Midnight Obsidian Gradient -->
    <radialGradient id="bgObsidian" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#26231E"/>
      <stop offset="55%" stop-color="#181613"/>
      <stop offset="100%" stop-color="#0E0D0B"/>
    </radialGradient>
    
    <!-- Outer Border Glow Gradient -->
    <linearGradient id="borderKesariGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA726"/>
      <stop offset="30%" stop-color="#FF5722"/>
      <stop offset="70%" stop-color="#E2746C"/>
      <stop offset="100%" stop-color="#FFD54F"/>
    </linearGradient>

    <!-- Solar Gold Bevel Gradients -->
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9C4"/>
      <stop offset="50%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>

    <linearGradient id="goldDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA000"/>
      <stop offset="60%" stop-color="#E65100"/>
      <stop offset="100%" stop-color="#BF360C"/>
    </linearGradient>

    <linearGradient id="coralLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A65"/>
      <stop offset="100%" stop-color="#F4511E"/>
    </linearGradient>

    <linearGradient id="coralDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E64A19"/>
      <stop offset="100%" stop-color="#BF360C"/>
    </linearGradient>

    <!-- Sage Accent Gradients -->
    <linearGradient id="sageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A5D6A7"/>
      <stop offset="50%" stop-color="#81C784"/>
      <stop offset="100%" stop-color="#388E3C"/>
    </linearGradient>

    <!-- Central Saffron Aura -->
    <radialGradient id="sunBurstAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE082" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#FF9800" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#E65100" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#E65100" stop-opacity="0"/>
    </radialGradient>

    <filter id="glowDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="starGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 1. Squircle Canvas Frame -->
  <rect x="20" y="20" width="472" height="472" rx="116" fill="url(#bgObsidian)" stroke="url(#borderKesariGold)" stroke-width="14"/>
  <!-- Subtle Inset Hairline -->
  <rect x="34" y="34" width="444" height="444" rx="102" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>

  <!-- 2. Ambient Radiant Solar Aura -->
  <circle cx="256" cy="256" r="185" fill="url(#sunBurstAura)"/>

  <!-- 3. Outer Sacred Geometry: 16 Radiant Surya Rays -->
  <g id="suryaRays" opacity="0.95">
    <!-- North / South / East / West Sun Flairs -->
    <polygon points="256,58 266,108 246,108" fill="url(#goldLight)"/>
    <polygon points="256,454 266,404 246,404" fill="url(#goldDark)"/>
    <polygon points="58,256 108,246 108,266" fill="url(#goldLight)"/>
    <polygon points="454,256 404,246 404,266" fill="url(#goldDark)"/>

    <!-- Diagonal Sun Flairs -->
    <polygon points="116,116 156,138 138,156" fill="url(#goldLight)"/>
    <polygon points="396,116 374,156 356,138" fill="url(#goldLight)"/>
    <polygon points="116,396 138,356 156,374" fill="url(#goldDark)"/>
    <polygon points="396,396 356,374 374,356" fill="url(#goldDark)"/>

    <!-- 8 Secondary Intermediate Minor Petals -->
    <polygon points="256,86 261,114 251,114" fill="#FF8A65" opacity="0.8"/>
    <polygon points="256,426 261,398 251,398" fill="#FF8A65" opacity="0.8"/>
    <polygon points="86,256 114,251 114,261" fill="#FF8A65" opacity="0.8"/>
    <polygon points="426,256 398,251 398,261" fill="#FF8A65" opacity="0.8"/>
    <polygon points="136,136 160,148 148,160" fill="#FF8A65" opacity="0.8"/>
    <polygon points="376,136 364,160 352,148" fill="#FF8A65" opacity="0.8"/>
    <polygon points="136,376 148,352 160,364" fill="#FF8A65" opacity="0.8"/>
    <polygon points="376,376 352,364 364,352" fill="#FF8A65" opacity="0.8"/>
  </g>

  <!-- 4. Sacred Concentric Rings (Dharma & Travel Waypoints) -->
  <circle cx="256" cy="256" r="172" fill="none" stroke="#FFB300" stroke-width="2.5" stroke-dasharray="7 7" opacity="0.6"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="#FF7043" stroke-width="3" opacity="0.75"/>
  <circle cx="256" cy="256" r="128" fill="none" stroke="#FFD54F" stroke-width="2" stroke-dasharray="3 5" opacity="0.85"/>

  <!-- 16 Waypoint Bindus (representing the 28 States & 8 UTs of Bharat) -->
  <g fill="#FFE082">
    <circle cx="256" cy="132" r="4.5"/>
    <circle cx="303" cy="141" r="4"/>
    <circle cx="344" cy="168" r="4.5"/>
    <circle cx="371" cy="209" r="4"/>
    <circle cx="380" cy="256" r="4.5"/>
    <circle cx="371" cy="303" r="4"/>
    <circle cx="344" cy="344" r="4.5"/>
    <circle cx="303" cy="371" r="4"/>
    <circle cx="256" cy="380" r="4.5"/>
    <circle cx="209" cy="371" r="4"/>
    <circle cx="168" cy="344" r="4.5"/>
    <circle cx="141" cy="303" r="4"/>
    <circle cx="132" cy="256" r="4.5"/>
    <circle cx="141" cy="209" r="4"/>
    <circle cx="168" cy="168" r="4.5"/>
    <circle cx="209" cy="141" r="4"/>
  </g>

  <!-- 5. 8-Pointed Grand Navigational Compass Star (North, South, East, West, NE, NW, SE, SW) -->
  <!-- Diagonal Points (Sage & Coral Accents) -->
  <polygon points="256,256 348,164 278,234" fill="url(#coralLight)"/>
  <polygon points="256,256 348,164 256,256" fill="url(#coralDark)"/>

  <polygon points="256,256 164,164 234,234" fill="url(#coralLight)"/>
  <polygon points="256,256 164,164 256,256" fill="url(#coralDark)"/>

  <polygon points="256,256 348,348 278,278" fill="url(#sageGrad)"/>
  <polygon points="256,256 348,348 256,256" fill="#2E7D32"/>

  <polygon points="256,256 164,348 234,278" fill="url(#sageGrad)"/>
  <polygon points="256,256 164,348 256,256" fill="#2E7D32"/>

  <!-- Primary Cardinal Arrows with 3D Gold Shading -->
  <!-- North Arrow (Reaching up to Himalaya / Ladakh) -->
  <polygon points="256,256 256,92 240,240" fill="url(#goldLight)"/>
  <polygon points="256,256 256,92 272,240" fill="url(#goldDark)"/>

  <!-- South Arrow (Reaching down to Kanyakumari / Kerala) -->
  <polygon points="256,256 256,420 272,272" fill="url(#goldLight)"/>
  <polygon points="256,256 256,420 240,272" fill="url(#goldDark)"/>

  <!-- East Arrow (Reaching to Varanasi & Northeast) -->
  <polygon points="256,256 420,256 272,240" fill="url(#goldLight)"/>
  <polygon points="256,256 420,256 272,272" fill="url(#goldDark)"/>

  <!-- West Arrow (Reaching to Rajasthan & Gujarat) -->
  <polygon points="256,256 92,256 240,272" fill="url(#goldLight)"/>
  <polygon points="256,256 92,256 240,240" fill="url(#goldDark)"/>

  <!-- 6. Inner Sacred Sanctum -->
  <circle cx="256" cy="256" r="66" fill="#151311" stroke="url(#borderKesariGold)" stroke-width="5"/>
  <circle cx="256" cy="256" r="54" fill="none" stroke="rgba(255,213,79,0.3)" stroke-width="1.5"/>

  <!-- 7. Auspicious Kesari Diya Flame at North Inner Rim -->
  <path d="M256 196 C250 208, 247 217, 247 225 C247 233, 251 237, 256 237 C261 237, 265 233, 265 225 C265 217, 262 208, 256 196 Z" fill="url(#borderKesariGold)"/>

  <!-- 8. Serene Sage Lotus Crescent at South Inner Rim -->
  <path d="M245 282 C251 289, 261 289, 267 282 C262 291, 250 291, 245 282 Z" fill="url(#sageGrad)"/>

  <!-- 9. Signature Central Glowing 4-Point BharatDarshan Star (✦) -->
  <!-- Layer 1: Ambient Golden Sparkle Aura -->
  <path d="M256 208 Q256 256 208 256 Q256 256 256 304 Q256 256 304 256 Q256 256 256 208 Z" fill="#FFE082" opacity="0.5"/>

  <!-- Layer 2: Sharp Diamond Center Star -->
  <path d="M256 214 Q256 256 214 256 Q256 256 256 298 Q256 256 298 256 Q256 256 256 214 Z" fill="#FFFFFF" filter="url(#starGlow)"/>

  <!-- Layer 3: Central Sun Core Jewel -->
  <circle cx="256" cy="256" r="7" fill="#FFE082"/>
  <circle cx="256" cy="256" r="3.5" fill="#FFFFFF"/>
</svg>